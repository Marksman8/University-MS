# User-facing messages for every ErrorCode (key = ErrorCode.messageKey()).
# Placeholders use java.text.MessageFormat argument names documented per facade method.

# --- auth ---
error.auth.bad_credentials=The username or password is incorrect.
error.auth.account_locked=This account is temporarily locked after too many failed sign-in attempts. Try again later.
error.auth.session_expired=Your session has expired. Please sign in again.
error.auth.access_denied=You do not have permission to perform this action.
error.auth.password_policy=The new password does not meet the password rules.
error.auth.last_admin=This change would leave the system without an active administrator.
error.auth.username_taken=That username is already in use.

# --- policy ---
error.policy.feature_disabled=This feature is currently turned off.
error.policy.rate_limited=Too many requests. Please wait a moment and try again.
error.policy.confirmation_required=This action needs explicit confirmation before it can proceed.

# --- domain ---
error.domain.validation_failed=Some of the information entered is not valid.
error.domain.not_found=The requested record does not exist.
error.domain.stale_data=This record was changed by someone else. Reload it and try again.
error.domain.invalid_transition=This action is not allowed in the record's current state.
error.domain.guard_failed=The conditions for this action are not met yet.

# --- offer ---
error.offer.slot_clash=The room or faculty member is already booked at that time.
error.offer.invalid_scheme=Assessment weights must add up to 100 percent.

# --- reg ---
error.reg.window_closed=The registration window is closed.
error.reg.already_enrolled=You are already enrolled in this course for this term.
error.reg.prereq_not_met=You have not completed the prerequisites for this course.
error.reg.credit_limit=This registration would exceed your credit limit for the term.
error.reg.timetable_clash=This section clashes with another class on your timetable.
error.reg.section_full=This section has no seats left.

# --- att ---
error.att.edit_window_closed=The attendance edit window has closed; an administrator correction is required.
error.att.invalid_session_date=The class session date is not valid for this term.

# --- marks ---
error.marks.mark_out_of_range=The mark is outside the allowed range.
error.marks.not_editable=This mark sheet cannot be edited in its current state.
error.marks.marks_incomplete=Marks are missing for one or more eligible students.

# --- infra ---
error.infra.db_unavailable=The database is not available right now. Please try again shortly.
error.infra.busy_try_again=The system is busy. Please try again in a moment.
error.infra.conflict_try_again=Another change happened at the same time. Please try again.
error.infra.timeout=The operation took too long and was stopped.
error.infra.cancelled=The operation was cancelled.
error.infra.internal_error=An unexpected error occurred. Quote the incident ID when reporting it.
