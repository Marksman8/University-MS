# UMS defaults. Overridden by application-<env>.properties, then by environment variables
# (UMS_ + property name after "ums.", upper-cased, "." and "-" -> "_"). Secrets are NOT set here:
# UMS_DB_PASSWORD, UMS_CONSOLE_DB_PASSWORD, UMS_LISTENER_DB_PASSWORD, UMS_OWNER_DB_PASSWORD,
# UMS_BACKUP_DB_PASSWORD come from the environment only.

# --- Database ---
ums.db.url=jdbc:postgresql://localhost:5432/ums
ums.db.user=ums_app
ums.db.console.user=ums_dev_console
ums.db.listener.user=ums_listener
ums.db.owner.user=ums_owner
ums.db.backup.user=ums_backup
ums.db.statement-timeout=PT10S
ums.db.lock-timeout=PT5S
ums.db.console.statement-timeout=PT15S

# --- Pools ---
ums.pool.app.max-size=10
ums.pool.console.max-size=3
ums.pool.connection-timeout=PT5S

# --- Policy defaults (master prompt section 1) ---
ums.policy.credit-limit=26
ums.policy.attendance-threshold-percent=75
ums.policy.attendance-edit-window=PT48H
ums.policy.lockout.max-failures=5
ums.policy.lockout.duration=PT15M
ums.policy.session-idle-timeout=PT30M

# --- Paths ---
ums.backup.dir=backups
ums.backup.second-dir=backups/weekly
ums.log.dir=logs
